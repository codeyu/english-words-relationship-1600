<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>形近词图谱 · 速记1600单词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFF6; --grid:rgba(31,95,208,.08); --panel:#FFFFFF; --line:#C9D5E6;
  --ink:#14233D; --ink2:#5A6B86; --accent:#1F5FD0; --accent-soft:#DCE8FB;
  --spell:#1F5FD0; --derive:#0C8A74; --compound:#B8690F; --hl:#D6336C;
  --node:#FFFFFF; --node-line:#9FB4D6; --center:#14233D; --center-ink:#F4F8FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E2A22; --grid:rgba(255,255,255,.06); --panel:#143830; --line:#2B5A4D;
    --ink:#EEF4EC; --ink2:#9DBBAE; --accent:#8FC1FF; --accent-soft:#1E4A5E;
    --spell:#8FC1FF; --derive:#7EE0B8; --compound:#F2BE6B; --hl:#FF8FB4;
    --node:#173F35; --node-line:#4E8676; --center:#EEF4EC; --center-ink:#0E2A22;
  }
}
:root[data-theme="dark"]{
  --bg:#0E2A22; --grid:rgba(255,255,255,.06); --panel:#143830; --line:#2B5A4D;
  --ink:#EEF4EC; --ink2:#9DBBAE; --accent:#8FC1FF; --accent-soft:#1E4A5E;
  --spell:#8FC1FF; --derive:#7EE0B8; --compound:#F2BE6B; --hl:#FF8FB4;
  --node:#173F35; --node-line:#4E8676; --center:#EEF4EC; --center-ink:#0E2A22;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
  font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
[lang="ja"]{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,g[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- 三列骨架 ---------- */
.app{height:100%;display:grid;gap:14px;padding:14px;
  --colL:clamp(220px,18vw,280px); --colR:clamp(280px,22vw,340px);
  grid-template-columns:var(--colL) minmax(0,1fr) var(--colR);
  transition:grid-template-columns .22s ease}
body.l-closed .app{--colL:40px}
body.r-closed .app{--colR:40px}
body.l-closed .col-left .panel,body.r-closed .col-right .panel{display:none}
.col-left .rail,.col-right .rail{display:none}
body.l-closed .col-left .rail,body.r-closed .col-right .rail{display:flex}
.rail{flex:1;min-height:0;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  writing-mode:vertical-rl;border:1.5px solid var(--line);border-radius:16px;background:var(--panel);
  color:var(--ink2);font-size:13px;letter-spacing:.1em;padding:10px 0}
.rail:hover{border-color:var(--accent);color:var(--ink)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fold{border:0;background:transparent;color:var(--ink2);cursor:pointer;font-size:16px;line-height:1;
  padding:2px 6px;border-radius:8px}
.fold:hover{background:var(--accent-soft);color:var(--ink)}
.col{min-height:0;display:flex;flex-direction:column;gap:10px}
.panel{border:1.5px solid var(--line);border-radius:16px;background:var(--panel)}

/* ---------- 左：单词一览 ---------- */
.col-left .panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.lhead{padding:12px 14px 10px;border-bottom:1.5px solid var(--line);display:grid;gap:8px}
.lhead h1{margin:0;font-family:"Bricolage Grotesque","Noto Sans SC",sans-serif;font-size:19px;line-height:1.2}
.lhead .cnt{font-size:12px;color:var(--ink2)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink2);font-size:13px;padding:5px 0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.lhead input{width:100%;padding:7px 10px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:13px}
.list{flex:1;min-height:0;overflow:auto;padding:6px 6px 12px;scrollbar-width:thin}
.grp{position:sticky;top:0;z-index:1;background:var(--panel);padding:6px 8px 4px;
  font-family:"Bricolage Grotesque",sans-serif;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.08em}
.pg{width:100%;text-align:left;border:0;background:transparent;color:var(--ink);cursor:pointer;
  padding:7px 8px;border-radius:9px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.pg:hover{background:var(--accent-soft)}
.pg .n{color:var(--ink2);font-weight:400;font-size:12px}
.pg.open{background:var(--accent-soft)}
.wItem{width:100%;text-align:left;border:0;background:transparent;color:var(--ink);cursor:pointer;
  padding:5px 8px;border-radius:9px;display:flex;align-items:baseline;gap:8px;line-height:1.3}
.wItem:hover{background:var(--accent-soft)}
.wItem b{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:14px;flex:none}
.wItem i{font-style:normal;font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wItem.on{background:var(--ink);color:var(--bg)}
.wItem.on i{color:var(--bg);opacity:.75}
.wItem.cen b{font-weight:700}
.sub-list{padding-left:6px;border-left:2px solid var(--line);margin:2px 0 8px 12px}
.lfoot{padding:8px 12px;border-top:1.5px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini{font-size:12px;cursor:pointer;border:1.5px solid var(--line);background:transparent;
  color:var(--ink2);padding:3px 9px;border-radius:8px}
.mini:hover{border-color:var(--accent);color:var(--ink)}
.empty{padding:16px 10px;font-size:13px;color:var(--ink2)}

/* ---------- 中：搜索 / 最近 / 工具栏 / 图 ---------- */
.searchbar{display:flex;gap:8px;align-items:center}
.searchbar input{flex:1;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:15px}
.recent{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px;font-size:12px;color:var(--ink2)}
.recent .chip{font-family:"Bricolage Grotesque",sans-serif;font-size:13px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:2px 11px;border-radius:999px}
.recent .chip:hover{border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.tog{font-size:13.5px;cursor:pointer;border:1.5px solid var(--line);background:var(--panel);
  color:var(--ink);padding:6px 12px;border-radius:9px}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:30px;height:8px;overflow:visible}
.crumb{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb b{font-family:"Bricolage Grotesque",sans-serif;color:var(--ink);font-weight:700}
.board{flex:1;min-height:0;border:1.5px solid var(--line);border-radius:16px;background-color:var(--panel);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;overflow:auto}
#graph{display:block;width:100%;height:100%;min-width:760px;min-height:560px}
body.dropping .board{outline:3px dashed var(--accent);outline-offset:4px}
.msg{font-size:12px;color:var(--ink2);margin:0}
.msg:empty{display:none}
.msg.err{color:var(--hl)}

/* ---------- 图形 ---------- */
.link{fill:none;stroke-width:2.2;transition:opacity .2s}
.link.s{stroke:var(--spell)} .link.d{stroke:var(--derive);stroke-dasharray:7 5}
.link.c{stroke:var(--compound);stroke-dasharray:2 5;stroke-linecap:round}
.link.dim{opacity:.22}
.mk-s{fill:var(--spell)} .mk-d{fill:var(--derive)} .mk-c{fill:var(--compound)}
.node{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.node.dragging{cursor:grabbing}
.node.dragging rect,.node.dragging circle{stroke:var(--accent);stroke-width:3.2}
.node rect,.node circle{fill:var(--node);stroke:var(--node-line);stroke-width:1.6;transition:stroke .15s,stroke-width .15s}
.node:hover rect,.node:hover circle{stroke:var(--accent)}
.node.sel rect,.node.sel circle{stroke:var(--accent);stroke-width:3.2}
.node.center circle{fill:var(--center);stroke:var(--center)}
.node .w{font-family:"Bricolage Grotesque","Noto Sans SC",sans-serif;font-weight:500;font-size:18px;fill:var(--ink);text-anchor:middle}
.node .z{font-size:13px;fill:var(--ink2);text-anchor:middle}
.node.center .w{fill:var(--center-ink);font-size:24px;font-weight:700}
.node.center .z{fill:var(--center-ink);opacity:.8;font-size:14px}
.node .hl{fill:var(--hl);font-weight:700}
.node .z.hidden{opacity:.45;letter-spacing:.1em}

/* ---------- 右：详情 ---------- */
.col-right .panel{flex:1;min-height:0;overflow:auto;padding:16px 18px;position:relative}
.col-right .fold{position:absolute;top:10px;right:10px}
#detail{display:grid;gap:12px;align-content:start}
.dword{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px}
.dword .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(28px,2.4vw,40px);line-height:1.05}
.zh{font-size:17px;font-weight:500}
.zh.hidden{color:var(--ink2);font-size:13px}
.speak{font-size:13px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:4px 11px;border-radius:8px}
.speak:hover{border-color:var(--accent)}
.where{font-size:12.5px;color:var(--ink2)}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--ink2);font-size:13px}
.path button,.kids button{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:2px 9px;border-radius:999px}
.path button:hover,.kids button:hover{border-color:var(--accent)}
.note{margin:0;font-size:13px;color:var(--ink2)}
.note .hl{color:var(--hl);font-weight:700;font-family:"Bricolage Grotesque",sans-serif}
.kids{display:flex;flex-wrap:wrap;gap:6px}
h3.sec{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}

@media (max-width:1180px){
  .app{height:auto;grid-template-columns:1fr}
  body.l-closed .app,body.r-closed .app{--colL:auto;--colR:auto}
  .rail{writing-mode:horizontal-tb;flex:none;padding:8px 0}
  .col-left .panel,.col-right .panel{max-height:60vh}
  .board{height:70vh}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ 左：单词一览 ============ -->
  <aside class="col col-left">
    <button class="rail" id="railL" aria-expanded="false" title="展开单词一览">单词一览 »</button>
    <div class="panel">
      <div class="lhead">
        <div class="hd">
          <h1>形近词图谱</h1>
          <button class="fold" id="foldL" title="收起单词一览" aria-label="收起单词一览">«</button>
        </div>
        <div class="seg" role="group" aria-label="排列方式">
          <button id="mAbc" aria-pressed="true">字母顺序</button>
          <button id="mCl" aria-pressed="false">按词簇</button>
        </div>
        <input id="filter" type="search" placeholder="筛选一览" aria-label="筛选单词一览" autocomplete="off" spellcheck="false">
        <div class="cnt" id="cnt"></div>
      </div>
      <div class="list" id="list"></div>
      <div class="lfoot">
        <button class="mini" id="tImport">导入 JSON</button>
        <button class="mini" id="tDel" hidden>移除导入</button>
        <input id="file" type="file" accept=".json,application/json" multiple hidden>
      </div>
    </div>
  </aside>

  <!-- ============ 中：搜索 + 图 ============ -->
  <main class="col col-mid">
    <div class="searchbar">
      <input id="q" type="search" placeholder="搜索单词，如 mountain" aria-label="搜索单词" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <div class="recent" id="recent" aria-label="最近查询"></div>
    <div class="toolbar">
      <button class="tog" id="tZh" aria-pressed="true">显示日文</button>
      <button class="tog" id="tHl" aria-pressed="true">标出相同部分</button>
      <button class="tog" id="tShake">摇一摇</button>
      <button class="tog" id="tPin" aria-pressed="false" title="开启后，拖到哪里就停在哪里">固定位置</button>
      <button class="tog" id="tReset">复位</button>
      <div class="legend" aria-label="图例">
        <span><svg viewBox="0 0 34 8"><line x1="0" y1="4" x2="34" y2="4" stroke="var(--spell)" stroke-width="2.4"/></svg>拼写相近</span>
        <span><svg viewBox="0 0 34 8"><line x1="0" y1="4" x2="34" y2="4" stroke="var(--derive)" stroke-width="2.4" stroke-dasharray="7 5"/></svg>派生变形</span>
        <span><svg viewBox="0 0 34 8"><line x1="0" y1="4" x2="34" y2="4" stroke="var(--compound)" stroke-width="2.4" stroke-dasharray="2 5" stroke-linecap="round"/></svg>复合词</span>
      </div>
    </div>
    <div class="crumb" id="crumb"></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div class="board"><svg id="graph" role="img" aria-label="形近词关系图"></svg></div>
  </main>

  <!-- ============ 右：词条详情 ============ -->
  <aside class="col col-right">
    <button class="rail" id="railR" aria-expanded="false" title="展开词条详情">词条 «</button>
    <div class="panel">
      <button class="fold" id="foldR" title="收起词条详情" aria-label="收起词条详情">×</button>
      <div id="detail" aria-live="polite"></div>
    </div>
  </aside>

</div>

<script src="data.js"></script>
<script>
// ---------- 词表：data.js 打包了 json/ 下的全部单元 ----------
const TYPE_NAME = {s:"拼写相近", d:"派生变形", c:"复合词"};
const TYPE_MAP  = {spelling:"s",derive:"d",compound:"c",s:"s",d:"d",c:"c"};

function normalize(j, fallbackName){
  if(!j || typeof j!=="object" || Array.isArray(j)) throw new Error("内容不是 JSON 对象");
  if(!Array.isArray(j.words) || !Array.isArray(j.edges)) throw new Error("缺少 words 或 edges 数组");
  const warn = [], Wd = {}, wordCl = {}, cl = {}, order = [];
  const ensure = id => { if(!cl[id]){ cl[id]={id, center:null, edges:[]}; order.push(id); } return cl[id]; };
  j.words.forEach(w=>{
    if(!w || !w.id) return;
    const id = String(w.id).toLowerCase();
    Wd[id] = w.jp ? String(w.jp) : (w.zh ? String(w.zh) : "");
    if(w.cluster!=null){ wordCl[id]=String(w.cluster); const c=ensure(String(w.cluster)); if(w.role==="center") c.center=id; }
  });
  (Array.isArray(j.clusters)?j.clusters:[]).forEach(c=>{
    if(!c || c.id==null) return;
    const cc = ensure(String(c.id));
    if(c.center) cc.center = String(c.center).toLowerCase();
  });
  const seenChild = {};
  j.edges.forEach(e=>{
    if(!e || !e.from || !e.to) return;
    const p = String(e.from).toLowerCase(), ch = String(e.to).toLowerCase();
    [p,ch].forEach(x=>{ if(!(x in Wd)){ Wd[x]=""; warn.push(`单词 ${x} 不在 words 里，已补上（无释义）`); } });
    const cid = wordCl[p] ?? wordCl[ch];
    if(cid==null){ warn.push(`边 ${p}→${ch} 找不到所属词簇，已跳过`); return; }
    const c = ensure(cid);
    if(seenChild[cid+"|"+ch]){ warn.push(`${ch} 有多个上级，只保留第一条`); return; }
    seenChild[cid+"|"+ch] = 1;
    c.edges.push([p,ch,TYPE_MAP[e.type]||"s"]);
  });
  const out = [];
  order.forEach(id=>{
    const c = cl[id];
    if(!c.edges.length) return;
    if(!c.center){
      const kids = new Set(c.edges.map(e=>e[1]));
      const root = c.edges.map(e=>e[0]).find(p=>!kids.has(p));
      if(!root){ warn.push(`词簇 ${id} 找不到中心词，已跳过`); return; }
      c.center = root;
    }
    const reach = new Set([c.center]); let grew = true;
    while(grew){ grew=false; c.edges.forEach(e=>{ if(reach.has(e[0]) && !reach.has(e[1])){ reach.add(e[1]); grew=true; } }); }
    const kept = c.edges.filter(e=>reach.has(e[0]) && reach.has(e[1]) && e[1]!==c.center);
    if(kept.length<c.edges.length) warn.push(`词簇 ${c.center}：有 ${c.edges.length-kept.length} 条边与中心词不相连，已忽略`);
    if(kept.length) out.push({center:c.center, edges:kept});
  });
  if(!out.length) throw new Error("没有可显示的词簇（检查 edges 的 from/to 和 words 的 cluster）");
  return {name: String(j.source || j.name || fallbackName || "未命名"), W:Wd, CLUSTERS:out, warn};
}

// ---------- 全局索引：单词 → 单元 / 词簇 ----------
const PAGES = [];          // {title, W, CLUSTERS, imported?}
const INDEX = {};          // word -> {pi, ci, center}
let ALL = [];              // 全部单词，按字母排序
function buildPages(raw){
  raw.forEach(p=>{
    try{
      const d = normalize(p, p.title || p.file);
      d.title = p.title || d.name;
      PAGES.push(d);
    }catch(e){ console.warn("跳过", p && p.file, e.message); }
  });
}
function reindex(){
  for(const k in INDEX) delete INDEX[k];
  PAGES.forEach((p,pi)=>{
    p.CLUSTERS.forEach((c,ci)=>{
      if(!INDEX[c.center]) INDEX[c.center] = {pi, ci, center:true};
      c.edges.forEach(e=>{ if(!INDEX[e[1]]) INDEX[e[1]] = {pi, ci, center:false}; });
    });
  });
  ALL = Object.keys(INDEX).sort();
}
function glossOf(w){ const at = INDEX[w]; return at ? (PAGES[at.pi].W[w] || "") : ""; }

// ---------- 状态 ----------
const state = {pi:0, ci:0, sel:null, showZh:true, showHl:true, pin:false,
               revealed:new Set(), mode:"abc", openPage:0, leftOpen:true, rightOpen:false};
let W = {}, CLUSTERS = [];
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag, attrs, parent, text){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
function lcs(a,b){
  let best="";
  for(let i=0;i<a.length;i++) for(let j=i+2;j<=a.length;j++){
    const s=a.slice(i,j); if(s.length>best.length && b.includes(s)) best=s;
  }
  return best;
}
function say(text, isErr){ const m=$("msg"); m.textContent=text||""; m.className="msg"+(isErr?" err":""); }

// --- 文本测量：按真实字宽算框，日文释义过长时在「、」处折成两行 ---
const F_WORD  = '500 18px "Bricolage Grotesque","Noto Sans SC",sans-serif';
const F_CWORD = '700 24px "Bricolage Grotesque","Noto Sans SC",sans-serif';
const F_GLOSS = '400 13px "Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';
const GLOSS_MAX = 110;
const _mc = document.createElement("canvas").getContext("2d");
function measure(t, font){ _mc.font = font; return _mc.measureText(t || "").width; }
function glossLines(t){
  if(!t) return [];
  if(measure(t, F_GLOSS) <= GLOSS_MAX) return [t];
  const wide = ls => Math.max(measure(ls[0],F_GLOSS), measure(ls[1],F_GLOSS));
  const parts = t.split("、");
  if(parts.length > 1){
    let best = null;
    for(let i=1;i<parts.length;i++){
      const ls = [parts.slice(0,i).join("、")+"、", parts.slice(i).join("、")];
      if(!best || wide(ls) < wide(best)) best = ls;
    }
    return best;
  }
  const NG = "ぁぃぅぇぉっゃゅょァィゥェォッャュョーヽ々、。）」";
  let mid = Math.ceil(t.length/2);
  for(let k=0;k<3 && NG.includes(t[mid]); k++) mid++;
  return [t.slice(0,mid), t.slice(mid)];
}

// ---------- 建树与静止位置 ----------
function buildTree(ci){
  const c = CLUSTERS[ci], map = {};
  const mk = w => map[w] || (map[w] = {w, kids:[], parent:null, type:null, depth:0});
  mk(c.center);
  c.edges.forEach(([p,ch,t])=>{ const P=mk(p), C=mk(ch); C.parent=P; C.type=t; P.kids.push(C); });
  const root = map[c.center];
  let maxD = 0, leaves = 0;
  (function walk(n,d){ n.depth=d; maxD=Math.max(maxD,d); if(!n.kids.length) leaves++; n.kids.forEach(k=>walk(k,d+1)); })(root,0);
  let idx = 0;
  (function ang(n){
    if(!n.kids.length){ n.a = (idx++ + .5)/leaves*Math.PI*2; return; }
    n.kids.forEach(ang);
    n.a = (n.kids[0].a + n.kids[n.kids.length-1].a)/2;
  })(root);
  const VW=1100, VH=820, cx=VW/2, cy=VH/2, R=350, sx=1.3;
  const all = [];
  (function place(n){
    const r = n.depth/maxD*R;
    n.hx = n===root ? cx : cx + Math.sin(n.a)*r*sx;
    n.hy = n===root ? cy : cy - Math.cos(n.a)*r;
    n.zl = glossLines(W[n.w] || "");
    const two = n.zl.length > 1;
    if(n===root){
      n.wy = two ? -6 : -2;
      n.zy = two ? [16,30] : [22];
      let rr = Math.max(54, measure(n.w,F_CWORD)/2 + 12);
      n.zl.forEach((t,i)=>{ rr = Math.max(rr, Math.hypot(measure(t,F_GLOSS)/2+8, Math.abs(n.zy[i])+6)); });
      n.hw = n.hh = Math.round(rr);
    }else{
      n.wy = two ? -10 : -3;
      n.zy = two ? [6,19] : [15];
      const gw = n.zl.reduce((m,t)=>Math.max(m, measure(t,F_GLOSS)), 0);
      n.hw = Math.round(Math.max(38, measure(n.w,F_WORD)/2 + 15, gw/2 + 12));
      n.hh = two ? 29 : 26;
    }
    n.ox=n.hx; n.oy=n.hy; n.x=n.hx; n.y=n.hy; n.vx=0; n.vy=0;
    all.push(n); n.kids.forEach(place);
  })(root);
  all.forEach(n=>{ n.L = n.parent ? Math.hypot(n.hx-n.parent.hx, n.hy-n.parent.hy) : 0; });
  return {root, all, map, VW, VH, cx, cy, ci};
}
function exitDist(n, ux, uy){
  if(n.depth===0) return n.hw + 4;
  const tx = Math.abs(ux)>1e-6 ? n.hw/Math.abs(ux) : 1e9;
  const ty = Math.abs(uy)>1e-6 ? n.hh/Math.abs(uy) : 1e9;
  return Math.min(tx,ty) + 5;
}

// ---------- 渲染 ----------
let tree = null, drag = null;
function render(keep){
  const svg = $("graph");
  const old = (keep && tree && tree.ci===state.ci) ? tree.map : null;
  svg.innerHTML = "";
  tree = buildTree(state.ci);
  svg.setAttribute("viewBox", `0 0 ${tree.VW} ${tree.VH}`);
  const defs = el("defs",{},svg);
  ["s","d","c"].forEach(t=>{
    const m = el("marker",{id:"mk-"+t,viewBox:"0 0 10 10",refX:"8",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);
    el("path",{d:"M0,0 L10,5 L0,10 z",class:"mk-"+t},m);
  });
  const g = el("g",{},svg);
  const linkG = el("g",{},g), nodeG = el("g",{},g);

  tree.all.forEach(n=>{
    const o = old && old[n.w];
    if(o){ n.x=o.x; n.y=o.y; n.vx=o.vx; n.vy=o.vy; n.hx=o.hx; n.hy=o.hy; n.L=o.L; }
    else if(!REDUCED){ n.x = tree.cx+(n.hx-tree.cx)*.06; n.y = tree.cy+(n.hy-tree.cy)*.06; }
  });
  tree.all.forEach(n=>{
    if(n.parent) n.link = el("path",{class:"link "+n.type,"marker-end":`url(#mk-${n.type})`},linkG);
  });
  tree.all.forEach(n=>{
    const isC = n.depth===0;
    const grp = el("g",{class:"node"+(isC?" center":""),tabindex:"0",role:"button","aria-label":n.w+" "+(W[n.w]||"")},nodeG);
    if(isC) el("circle",{r:n.hw},grp); else el("rect",{x:-n.hw,y:-n.hh,width:n.hw*2,height:n.hh*2,rx:14},grp);
    const t = el("text",{class:"w",y:n.wy},grp);
    const hl = (!isC && state.showHl && n.parent) ? lcs(n.w, n.parent.w) : "";
    if(hl){
      const i = n.w.indexOf(hl);
      if(i>0) el("tspan",{},t,n.w.slice(0,i));
      el("tspan",{class:"hl"},t,hl);
      if(i+hl.length<n.w.length) el("tspan",{},t,n.w.slice(i+hl.length));
    } else t.textContent = n.w;
    n.zEl = el("text",{class:"z",lang:"ja"},grp);
    setZh(n);
    n.g = grp;
    bindDrag(n);
  });
  applySelection();
  updateView();
  kick();
}
function setZh(n){
  const show = state.showZh || state.revealed.has(n.w);
  n.zEl.setAttribute("class","z"+(show?"":" hidden"));
  n.zEl.textContent = "";
  const lines = show ? (n.zl.length ? n.zl : [""]) : ["？？"];
  const ys = lines.length === n.zy.length ? n.zy : [n.zy[0]];
  lines.forEach((t,i)=> el("tspan",{x:0,y:ys[i]},n.zEl,t));
}
function updateView(){
  tree.all.forEach(n=>{
    n.g.setAttribute("transform",`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    if(!n.parent) return;
    const p = n.parent, dx=n.x-p.x, dy=n.y-p.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
    const d1 = exitDist(p,ux,uy), d2 = exitDist(n,-ux,-uy)+3;
    const x1=p.x+ux*d1, y1=p.y+uy*d1, x2=n.x-ux*d2, y2=n.y-uy*d2;
    const mx=(x1+x2)/2 - uy*len*.05, my=(y1+y2)/2 + ux*len*.05;
    n.link.setAttribute("d",`M${x1.toFixed(1)},${y1.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`);
  });
}

// ---------- 弹簧物理 ----------
let raf = 0;
function kick(){ if(!raf) raf = requestAnimationFrame(tick); }
function step(){
  const ns = tree.all;
  ns.forEach(n=>{ n.fx=0; n.fy=0; });
  ns.forEach(n=>{ const k = n.depth===0 ? .05 : .014; n.fx += (n.hx-n.x)*k; n.fy += (n.hy-n.y)*k; });
  ns.forEach(n=>{
    if(!n.parent) return;
    const p=n.parent, dx=n.x-p.x, dy=n.y-p.y, d=Math.hypot(dx,dy)||1, f=(d-n.L)*.035, ux=dx/d, uy=dy/d;
    n.fx -= ux*f; n.fy -= uy*f; p.fx += ux*f; p.fy += uy*f;
  });
  for(let i=0;i<ns.length;i++) for(let j=i+1;j<ns.length;j++){
    const a=ns[i], b=ns[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, min=(a.hw+b.hw)*.9+20;
    if(d<min){ const f=(min-d)*.03, ux=dx/d, uy=dy/d; a.fx-=ux*f; a.fy-=uy*f; b.fx+=ux*f; b.fy+=uy*f; }
  }
  ns.forEach(n=>{
    if(drag && drag.n===n){ n.vx=0; n.vy=0; return; }
    n.vx = (n.vx+n.fx)*.9; n.vy = (n.vy+n.fy)*.9;
    n.x += n.vx; n.y += n.vy;
  });
}
function tick(){
  raf = 0;
  step(); updateView();
  let e = 0;
  tree.all.forEach(n=>{ e += n.vx*n.vx + n.vy*n.vy + ((n.hx-n.x)**2+(n.hy-n.y)**2)*.0004; });
  if(drag || e > .03) kick();
  else { tree.all.forEach(n=>{ n.vx=n.vy=0; }); }
}

// ---------- 拖拽 ----------
function svgPoint(e){
  const svg=$("graph"), pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function bindDrag(n){
  const g = n.g;
  g.addEventListener("pointerdown",e=>{
    e.preventDefault();
    try{ g.setPointerCapture(e.pointerId); }catch(_){}
    const p = svgPoint(e);
    drag = {n, id:e.pointerId, ox:p.x-n.x, oy:p.y-n.y, cx:e.clientX, cy:e.clientY, moved:false};
    kick();
  });
  g.addEventListener("pointermove",e=>{
    if(!drag || drag.n!==n || drag.id!==e.pointerId) return;
    if(!drag.moved && Math.hypot(e.clientX-drag.cx, e.clientY-drag.cy) > 4){ drag.moved=true; g.classList.add("dragging"); }
    if(drag.moved){ const p=svgPoint(e); n.x=p.x-drag.ox; n.y=p.y-drag.oy; }
  });
  const end = e=>{
    if(!drag || drag.n!==n || drag.id!==e.pointerId) return;
    const wasClick = !drag.moved && e.type==="pointerup";
    g.classList.remove("dragging");
    const moved = drag.moved;
    drag = null;
    if(moved && state.pin) commitPin(n);
    kick();
    if(wasClick) pick(n.w, true);
  };
  g.addEventListener("pointerup",end);
  g.addEventListener("pointercancel",end);
  g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(n.w, true); } });
}

// ---------- 固定位置 ----------
function descendants(n, out){ n.kids.forEach(k=>{ out.push(k); descendants(k,out); }); return out; }
function recomputeL(){ tree.all.forEach(n=>{ if(n.parent) n.L = Math.hypot(n.hx-n.parent.hx, n.hy-n.parent.hy); }); }
function commitPin(n){
  const dx = n.x - n.hx, dy = n.y - n.hy;
  n.hx += dx; n.hy += dy;
  descendants(n, []).forEach(k=>{ k.hx += dx; k.hy += dy; });
  recomputeL();
}
function resetHomes(){
  tree.all.forEach(n=>{ n.hx=n.ox; n.hy=n.oy; });
  recomputeL(); kick();
}

// ---------- 选中与详情（右列） ----------
function pathTo(n){ const p=[]; for(let x=n;x;x=x.parent) p.unshift(x); return p; }
function applySelection(){
  const sel = tree.map[state.sel] || tree.root;
  const path = new Set(pathTo(sel));
  tree.all.forEach(n=>{
    n.g.classList.toggle("sel", n===sel);
    if(n.link) n.link.classList.toggle("dim", !path.has(n));
  });
  renderDetail(sel);
  markList();
}
function renderDetail(n){
  const d = $("detail");
  d.innerHTML = "";
  const zshow = state.showZh || state.revealed.has(n.w);

  const row = document.createElement("div"); row.className="dword";

  const sp = document.createElement("button"); sp.className="speak"; sp.textContent="朗读";

  row.appendChild(sp);
  d.appendChild(row);

  const zh = document.createElement("div"); zh.className="zh"+(zshow?"":" hidden"); zh.lang="ja";
  zh.textContent = zshow ? (W[n.w] || "（无释义）") : "（点击图中单词显示日文）";
  d.appendChild(zh);

  const where = document.createElement("div"); where.className="where";
  where.textContent = `${PAGES[state.pi].title} · 词簇 ${CLUSTERS[state.ci].center}`;
  d.appendChild(where);

  const chain = pathTo(n);
  if(chain.length>1){
    const h = document.createElement("h3"); h.className="sec"; h.textContent="记忆路径"; d.appendChild(h);
    const pr = document.createElement("div"); pr.className="path";
    chain.forEach((x,i)=>{
      if(i>0) pr.appendChild(document.createTextNode("→"));
      const b=document.createElement("button"); b.textContent=x.w; b.title=W[x.w]||""; b.onclick=()=>pick(x.w); pr.appendChild(b);
    });
    d.appendChild(pr);
    const hl = lcs(n.w, n.parent.w);
    const note = document.createElement("p"); note.className="note";
    note.append(`${n.w} 由 ${n.parent.w} 连出，关系：${TYPE_NAME[n.type]}。`);
    if(hl){ note.append(" 相同部分："); const s=document.createElement("span"); s.className="hl"; s.textContent=hl; note.appendChild(s); note.append("。"); }
    d.appendChild(note);
  } else {
    const note = document.createElement("p"); note.className="note";
    note.textContent = `${n.w} 是这一组的中心词，共连出 ${tree.all.length-1} 个相关单词。拖动任意单词试试。`;
    d.appendChild(note);
  }

  if(n.kids.length){
    const h = document.createElement("h3"); h.className="sec"; h.textContent="由它连出"; d.appendChild(h);
    const ks = document.createElement("div"); ks.className="kids";
    n.kids.forEach(k=>{ const b=document.createElement("button"); b.textContent=k.w; b.title=W[k.w]||""; b.onclick=()=>pick(k.w); ks.appendChild(b); });
    d.appendChild(ks);
  }
}

// ---------- 单元 / 词簇切换 ----------
function setPage(pi, keepSel){
  state.pi = pi;
  const p = PAGES[pi];
  W = p.W; CLUSTERS = p.CLUSTERS;
  if(!keepSel){ state.ci = 0; state.sel = CLUSTERS[0].center; }
  state.revealed.clear();
  $("tDel").hidden = !p.imported;
  document.title = "形近词图谱 · " + p.title;
}
function crumb(){
  const c = $("crumb");
  c.textContent = "";
  const p = PAGES[state.pi];
  c.append(p.title + " · 词簇 ");
  const b = document.createElement("b"); b.textContent = CLUSTERS[state.ci].center; c.appendChild(b);
  c.append(`（第 ${state.ci+1}/${CLUSTERS.length} 组，${tree ? tree.all.length : 0} 个单词）`);
}
function goto(pi, ci, w){
  if(pi !== state.pi) setPage(pi, true);
  state.ci = ci; state.sel = w; state.revealed.add(w);
  state.openPage = pi;
  render(false); crumb(); renderList();
}
function pick(w, fromGraph){
  w = String(w).toLowerCase();
  if(fromGraph) setRight(true);
  const here = CLUSTERS.findIndex(c=>c.center===w || c.edges.some(e=>e[1]===w));
  if(here >= 0){
    state.revealed.add(w); state.sel = w;
    if(here !== state.ci){ state.ci = here; render(false); }
    else { setZh(tree.map[w]); applySelection(); }
    crumb();
    return true;
  }
  const at = INDEX[w];
  if(!at) return false;
  goto(at.pi, at.ci, w);
  return true;
}

// ---------- 左列：单词一览 ----------
function renderList(){
  const box = $("list");
  box.textContent = "";
  const kw = $("filter").value.trim().toLowerCase();
  const frag = document.createDocumentFragment();

  if(state.mode === "abc"){
    const words = kw ? ALL.filter(w=>w.includes(kw)) : ALL;
    let letter = "";
    words.forEach(w=>{
      const L = w[0].toUpperCase();
      if(L !== letter){ letter = L; const h=document.createElement("div"); h.className="grp"; h.textContent=L; frag.appendChild(h); }
      frag.appendChild(wordButton(w, INDEX[w]));
    });
    $("cnt").textContent = `共 ${ALL.length} 个单词` + (kw ? `，筛出 ${words.length} 个` : "");
    if(!words.length) frag.appendChild(emptyHint(kw));
  }else{
    let shown = 0;
    PAGES.forEach((p,pi)=>{
      const cls = p.CLUSTERS.filter(c=>!kw || c.center.includes(kw) || c.edges.some(e=>e[1].includes(kw)));
      if(!cls.length) return;
      shown += cls.length;
      const head = document.createElement("button");
      head.className = "pg" + (state.openPage===pi ? " open" : "");
      head.append(p.title);
      const n = document.createElement("span"); n.className="n"; n.textContent = `${p.CLUSTERS.length} 组`;
      head.appendChild(n);
      head.onclick = ()=>{ state.openPage = state.openPage===pi ? -1 : pi; renderList(); };
      frag.appendChild(head);
      if(state.openPage !== pi && !kw) return;
      const sub = document.createElement("div"); sub.className="sub-list";
      cls.forEach(c=>{
        const ci = p.CLUSTERS.indexOf(c);
        sub.appendChild(wordButton(c.center, {pi, ci, center:true}));
        c.edges.forEach(e=>sub.appendChild(wordButton(e[1], {pi, ci})));
      });
      frag.appendChild(sub);
    });
    $("cnt").textContent = `共 ${PAGES.length} 单元` + (kw ? `，筛出 ${shown} 组` : "");
    if(!shown) frag.appendChild(emptyHint(kw));
  }
  box.appendChild(frag);
  markList();
}
function emptyHint(kw){
  const e = document.createElement("p"); e.className="empty";
  e.textContent = kw ? `没有匹配「${kw}」的单词。` : "没有词表数据。";
  return e;
}
function wordButton(w, at){
  const b = document.createElement("button");
  b.className = "wItem" + (at && at.center ? " cen" : "");
  b.dataset.w = w;
  const s = document.createElement("b"); s.textContent = w;
  const i = document.createElement("i"); i.lang = "ja";
  i.textContent = (at ? (PAGES[at.pi].W[w] || "") : glossOf(w));
  b.append(s, i);
  b.onclick = ()=>{
    if(at) goto(at.pi, at.ci, w); else pick(w);

}
function markList(){

function search(v, remember){
  v = String(v).trim().toLowerCase();
  if(!v) return;
  const hit = INDEX[v] ? v : (ALL.find(w=>w.startsWith(v)) || ALL.find(w=>w.includes(v)));
  if(!hit){ say(`没有找到「${v}」。`, true); return; }
  say("");
  if(pick(hit)){ if(remember) pushRecent(hit); setLeft(false); }
}

function saveStore(){

}

    });

async function importFiles(files){
  const msgs = []; let last = -1, ok = 0;
  for(const f of files){
    try{
      const j = JSON.parse(await f.text());
      const list = Array.isArray(j) ? j : [j];
      list.forEach((item,k)=>{
        const label = f.name.replace(/\.json$/i,"") + (list.length>1 ? "#"+(k+1) : "");
        const d = normalize(item, label);
        d.title = item.source || item.name || label; d.raw = item; d.imported = true;
        const at = PAGES.findIndex(x=>x.imported && x.title===d.title);
        if(at>=0){ PAGES[at]=d; last=at; } else { PAGES.push(d); last=PAGES.length-1; }
        ok++;
        d.warn.forEach(w=>msgs.push(`${d.title}：${w}`));
      });
    }catch(e){ msgs.push(`${f.name}：读取失败，${e.message}`); }
  }
  if(ok){
    saveStore(); reindex();
    setPage(last); state.openPage = last;
    setMode("cluster"); render(false); crumb(); renderList();
  }
  const failed = msgs.some(m=>m.includes("读取失败"));
  say((ok?`已导入 ${ok} 个词表。`:"") + (msgs.length?" "+msgs.slice(0,3).join("；")+(msgs.length>3?` 等 ${msgs.length} 条`:""):""), failed && !ok);
}
$("tImport").onclick = ()=>$("file").click();
$("file").onchange = e=>{ importFiles([...e.target.files]); e.target.value=""; };
$("tDel").onclick = ()=>{
  const p = PAGES[state.pi];
  if(!p.imported) return;
  PAGES.splice(state.pi,1); saveStore(); reindex();
  say(`已移除 ${p.title}。`);
  setPage(0); state.openPage = 0; render(false); crumb(); renderList();
};
["dragenter","dragover"].forEach(t=>window.addEventListener(t,e=>{ if(e.dataTransfer && [...e.dataTransfer.types].includes("Files")){ e.preventDefault(); document.body.classList.add("dropping"); } }));
["dragleave","drop"].forEach(t=>window.addEventListener(t,e=>{ if(t==="dragleave" && e.relatedTarget) return; document.body.classList.remove("dropping"); }));
window.addEventListener("drop",e=>{
  if(!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  importFiles([...e.dataTransfer.files].filter(f=>/\.json$/i.test(f.name) || f.type==="application/json"));
});

// ---------- 启动 ----------
buildPages(window.WC_PAGES || []);
loadStore();
reindex();
loadRecent(); renderRecent();
let ui = {}; try{ ui = JSON.parse(localStorage.getItem(UI_KEY)) || {}; }catch(e){}
setLeft(ui.left !== false);   // 左列记住上次的开合
setRight(false);              // 右列默认收起，点图里的单词才展开
if(!PAGES.length){
  say("没读到词表数据（app/data.js）。请运行：python tools/build_data.py", true);
}else{
  setPage(0);
  render(false); crumb(); renderList();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(tree) render(true); });
</script>
</body>
